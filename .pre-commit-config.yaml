# Stop at the first failing hook. This is global, so it also applies to the
# pre-commit stage (a lint/whitespace failure hides later checks until it is
# fixed). The point is pre-push: without it a failed vitest hook still ran
# patch-coverage, which found no coverage report and re-ran the whole suite
# (see scripts/check-patch-coverage.mjs) - doubling the load at exactly the
# moment the host was already struggling.
fail_fast: true

repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      # Enforces this repo's "never commit directly to main" rule (see
      # AGENTS.md) locally, not just via branch protection on the remote —
      # catches the mistake before a push even happens. Default protected
      # branches (master, main) already cover this repo's default branch;
      # no args needed.
      - id: no-commit-to-branch

  - repo: local
    hooks:
      # `files:` below is path-scoped per workspace (backend = anything
      # outside frontend/, frontend = anything under it) rather than the
      # old path-blind `types_or:`, which triggered ALL FOUR lint/typecheck
      # hooks (plus both test hooks) off of any .ts/.tsx/.js/.jsx change
      # anywhere in the repo — so a frontend-only commit paid for a full
      # backend lint+typecheck it couldn't possibly need, and vice versa.
      # Root-level backend config files (eslint.config.js, vitest.config.ts,
      # tsconfig.json, drizzle.config.ts, ...) still match the backend
      # pattern since they live outside frontend/, preserving today's
      # trigger behavior for repo-root changes.
      - id: npm-lint
        name: eslint (backend)
        entry: npm run lint
        language: system
        files: '^(?!frontend/).*\.(ts|tsx|js|jsx|mjs|cjs)$'
        pass_filenames: false
        stages: [pre-commit]

      - id: npm-lint-frontend
        name: eslint (frontend)
        entry: npm --prefix frontend run lint
        language: system
        files: '^frontend/.*\.(ts|tsx|js|jsx)$'
        pass_filenames: false
        stages: [pre-commit]

      # Issue #647 / roadmap 7.8 — added while hardening scripts/self-update.sh
      # (the agent auto-update mechanism). Uses the already-installed system
      # `shellcheck` binary, same "language: system" convention as every
      # other hook in this local repo block, rather than a pre-commit-managed
      # external repo hook that would need network access to fetch. Repo-wide
      # `*.sh` scope (not just scripts/) so deploy/install.sh and any future
      # shell script are covered too; see .shellcheckrc for the one
      # project-level suppression this required.
      - id: shellcheck
        name: shellcheck (shell scripts)
        entry: shellcheck
        language: system
        files: '\.sh$'
        stages: [pre-commit]

      - id: npm-typecheck
        name: typecheck (backend)
        entry: npm run typecheck
        language: system
        files: '^(?!frontend/).*\.(ts|tsx)$'
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: npm-typecheck-frontend
        name: typecheck (frontend)
        entry: npm --prefix frontend run typecheck
        language: system
        files: '^frontend/.*\.(ts|tsx)$'
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: npm-format-check
        name: prettier (format check)
        entry: npm run format:check
        language: system
        pass_filenames: false
        stages: [pre-push]

      # Issue #942 — guards against CLAUDE.md/GEMINI.md/AGENTS.override.md
      # silently re-acquiring a content-bearing copy of AGENTS.md's own
      # scaffold region (see the script's own header comment for the full
      # reasoning); AGENTS.md itself is no longer read by this check at all,
      # so it isn't in the trigger pattern below. Any of the three may or
      # may not exist in a given commit (this repo has no GEMINI.md at
      # all) — the check treats an absent file as clean. This hook is the
      # fast staged-file path; the unconditional working-tree probe that
      # also catches an untracked AGENTS.override.md (e.g. one just created
      # by the Agent Rules Editor, never staged) comes from `npm run lint`'s
      # check:scaffold-region-sync step. Deliberately kept `files:`-scoped
      # rather than `always_run: true`, per this repo's own
      # developer-worktree tooling convention (see CONTRIBUTING.md's
      # "Developer worktrees" section).
      - id: scaffold-region-sync
        name: no content-bearing scaffold-region mirror/override (CLAUDE.md / GEMINI.md / AGENTS.override.md, if present)
        entry: node scripts/check-scaffold-region-sync.mjs
        language: system
        files: '^(AGENTS\.override|GEMINI|CLAUDE)\.md$'
        pass_filenames: false
        stages: [pre-commit]

      # The review protocol's wording is stated in several places (the MCP tool
      # description, the CLI output, the agent guide, AGENTS.md) because an
      # agent reads a different one depending on where it stands. This check
      # fails when they stop agreeing — a stale copy of the rule is how the
      # duplicate-review queue came back.
      - id: review-protocol-sync
        name: the review protocol's rule is stated consistently
        entry: node scripts/check-review-protocol-sync.mjs
        language: system
        files: '^(AGENTS\.md|docs/agent-guide\.md|src/(cli|mcp)/.*\.mjs|scripts/check-review-protocol-sync\.mjs)$'
        pass_filenames: false
        stages: [pre-commit]

      # The pre-push test hooks run `test:coverage`, NOT `test` — the
      # patch-coverage hook below reads the coverage JSON they produce, so
      # running plain `test` here would make that hook re-run the whole
      # suite a second time to regenerate it.
      - id: npm-test
        name: vitest (unit tests, backend)
        entry: scripts/with-gate-lock.sh npm run test:coverage
        language: system
        files: '^(?!frontend/).*\.(ts|tsx|js|jsx|mjs|cjs)$'
        pass_filenames: false
        stages: [pre-push]

      - id: npm-test-frontend
        name: vitest (unit tests, frontend)
        entry: scripts/with-gate-lock.sh npm --prefix frontend run test:coverage
        language: system
        files: '^frontend/.*\.(ts|tsx|js|jsx)$'
        pass_filenames: false
        stages: [pre-push]

      # The pre-push hook wiring's own invariants: the patch-coverage hook
      # must stay the LAST hook in this file (pre-commit runs hooks in file
      # order, and it consumes the coverage report the test hooks write),
      # and the test hooks must run the coverage variant so that report
      # exists. Both fail silently if they drift, so they are checked
      # instead of merely documented — and this check itself has to sit
      # BEFORE the patch-coverage hook, or it would break the very
      # invariant it asserts.
      - id: pre-push-hook-order
        name: the pre-push patch-coverage hook wiring is intact
        entry: node scripts/check-pre-push-hook-order.mjs
        language: system
        files: '^\.pre-commit-config\.yaml$'
        pass_filenames: false
        stages: [pre-commit]

      # The >=75% patch-coverage rule (AGENTS.md's "Core invariants"). This
      # hook MUST stay last in this file: pre-commit runs hooks in file
      # order, and this one consumes the coverage/coverage-final.json that
      # the two test hooks above just wrote.
      #
      # The check itself is scripts/check-patch-coverage.mjs, reused
      # unchanged through a thin wrapper that skips (rather than fails)
      # when no base ref is available. CI keeps the same floor advisory
      # via the `codecov/patch` status — this hook is the local half of
      # that rule, and the reason it was previously enforced nowhere.
      - id: patch-coverage
        name: patch test coverage (>= 75% on changed lines)
        entry: npm run check:patch-coverage
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
