repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict

  - repo: local
    hooks:
      # `files:` below is path-scoped per workspace (backend = anything
      # outside frontend/, frontend = anything under it) rather than the
      # old path-blind `types_or:`, which triggered ALL FOUR lint/typecheck
      # hooks (plus both test hooks) off of any .ts/.tsx/.js/.jsx change
      # anywhere in the repo — so a frontend-only commit paid for a full
      # backend lint+typecheck it couldn't possibly need, and vice versa.
      # Root-level backend config files (eslint.config.js, vitest.config.ts,
      # tsconfig.json, drizzle.config.ts, ...) still match the backend
      # pattern since they live outside frontend/, preserving today's
      # trigger behavior for repo-root changes.
      - id: npm-lint
        name: eslint (backend)
        entry: npm run lint
        language: system
        files: '^(?!frontend/).*\.(ts|tsx|js|jsx|mjs|cjs)$'
        pass_filenames: false
        stages: [pre-commit]

      - id: npm-lint-frontend
        name: eslint (frontend)
        entry: npm --prefix frontend run lint
        language: system
        files: '^frontend/.*\.(ts|tsx|js|jsx)$'
        pass_filenames: false
        stages: [pre-commit]

      - id: npm-typecheck
        name: typecheck (backend)
        entry: npm run typecheck
        language: system
        files: '^(?!frontend/).*\.(ts|tsx)$'
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: npm-typecheck-frontend
        name: typecheck (frontend)
        entry: npm --prefix frontend run typecheck
        language: system
        files: '^frontend/.*\.(ts|tsx)$'
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: npm-format-check
        name: prettier (format check)
        entry: npm run format:check
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: npm-test
        name: vitest (unit tests, backend)
        entry: npm run test
        language: system
        files: '^(?!frontend/).*\.(ts|tsx|js|jsx|mjs|cjs)$'
        pass_filenames: false
        stages: [pre-push]

      - id: npm-test-frontend
        name: vitest (unit tests, frontend)
        entry: npm --prefix frontend run test
        language: system
        files: '^frontend/.*\.(ts|tsx|js|jsx)$'
        pass_filenames: false
        stages: [pre-push]
