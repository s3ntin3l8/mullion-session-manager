name: Release Please

on:
  push:
    branches:
      - main
  # #744 — lets Mullion's own "Run release-please" button
  # (POST /api/projects/:id/release/run) dispatch this job on demand,
  # without waiting for the next push to main. Only the caller here needs
  # this trigger; the org's reusable workflow it calls into
  # (s3ntin3l8/.github/.github/workflows/release-please.yml) stays
  # workflow_call-only.
  workflow_dispatch:

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
    uses: s3ntin3l8/.github/.github/workflows/release-please.yml@main

  # Builds and attaches the versioned-release tarball (see deploy/README.md
  # and src/services/update-checker.ts) that self-update.sh downloads and
  # installs. This is a real multi-step job rather than a call into
  # s3ntin3l8/.github's reusable workflows, unlike every other job in this
  # file — a deliberate, deployment-target-specific exception to this repo's
  # normal "thin caller" CI convention (there's no reusable "build a tarball
  # and upload it to a release" workflow upstream, and this artifact only
  # exists for this repo's own native-host deploy path, not something other
  # repos in the org would share).
  #
  # NOT triggered via `on: release: published` — GitHub does not fire that
  # event for a release created by the default GITHUB_TOKEN (the anti-
  # recursion rule release-please itself relies on), so that trigger would
  # simply never run. Gating on release-please's own `release_created`
  # output is the only shape that works.
  build-tarball:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"

      - name: Build backend
        run: |
          npm ci
          npm run build

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Assemble release tarball
        run: |
          set -euo pipefail
          # Strip the leading "v" release-please's tag carries — matches the
          # bare MAJOR.MINOR.PATCH package.json's own "version" field uses
          # (see src/services/update-checker.ts's parseVersion).
          version="${VERSION#v}"
          # Staged so self-update.sh's `tar -xzf ... -C "$RELEASE_DIR"` lands
          # dist/, frontend/dist/, drizzle/, scripts/, package.json directly
          # under the release dir — the same layout src/plugins/env.ts's
          # cwd-relative defaults (FRONTEND_DIST=./frontend/dist,
          # drizzle/ via path.resolve("drizzle")) expect when
          # WorkingDirectory is that release dir. Built outside the repo
          # checkout (../staging) so it's never itself picked up by a later
          # `cp -r`, and tarred with `-C staging .` (no wrapping directory)
          # rather than `tar -czf x.tgz staging/` (which would nest
          # everything one level too deep on extraction).
          staging="../staging"
          rm -rf "$staging" && mkdir -p "$staging/frontend"
          cp -r dist "$staging/dist"
          cp -r frontend/dist "$staging/frontend/dist"
          cp -r drizzle "$staging/drizzle"
          cp -r scripts "$staging/scripts"
          cp package.json package-lock.json "$staging/"
          tar -czf "mullion-${version}.tgz" -C "$staging" .
          # Checksum the tarball as its own asset — self-update.sh and
          # deploy/install.sh both verify against this before extracting
          # (Hermes review, PR #54: "no integrity verification of the
          # downloaded tarball"). Standard sha256sum output format
          # ("<hex>  <filename>") so `sha256sum -c` can verify it directly.
          sha256sum "mullion-${version}.tgz" > "mullion-${version}.tgz.sha256"

      - name: Upload tarball and checksum to the GitHub Release
        run: |
          version="${VERSION#v}"
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            "mullion-${version}.tgz" "mullion-${version}.tgz.sha256"

  # Round 3 (PR2/PR3, Windows SEA) — builds and attaches `mullion-helper.exe`
  # (scripts/build-helper-sea.mjs) the same way build-tarball above attaches
  # the server tarball: a real multi-step job (no reusable upstream
  # workflow for this either), gated on the same release_created output,
  # checksummed the same way. `windows-latest`, not cross-compiled from
  # ubuntu-latest — postject injects into a COPY of process.execPath, so the
  # blob and the host node.exe must come from the same real Windows Node
  # install for the result to actually be a valid PE the OS will run; cross-
  # generating a Windows SEA from Linux isn't an officially supported Node
  # SEA path.
  build-helper-exe:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"

      - name: Build mullion-helper.exe
        run: |
          npm ci
          npm run build:helper-sea

      - name: Smoke test the built exe
        shell: pwsh
        run: |
          $output = & build\helper-sea\mullion-helper.exe bogus 2>&1
          if ($LASTEXITCODE -ne 2) { throw "expected exit code 2, got $LASTEXITCODE" }
          # GitHub Actions' pwsh shell fails a step on whatever $LASTEXITCODE
          # is when the script ends, regardless of the `if` check above
          # having already validated it as the EXPECTED value (2, for an
          # unrecognized verb) — without this, the exe's own designed exit
          # code would re-surface as a spurious failure of THIS step, which
          # would skip the upload step entirely and ship a release with no
          # mullion-helper.exe attached.
          exit 0

      - name: Rename, checksum, and upload to the GitHub Release
        shell: pwsh
        run: |
          $version = $env:VERSION -replace '^v', ''
          $exeName = "mullion-helper-$version.exe"
          Copy-Item "build\helper-sea\mullion-helper.exe" $exeName

          # sha256sum's own output format ("<lowercase-hex>  <filename>"),
          # not PowerShell's default Get-FileHash table — self-update.sh and
          # deploy/install.sh both expect a `sha256sum -c`-compatible file
          # for the tarball's own checksum (see build-tarball above); this
          # asset's checksum matches that same convention so anyone
          # verifying it can use the same one-liner regardless of which
          # release asset they downloaded.
          $hash = (Get-FileHash $exeName -Algorithm SHA256).Hash.ToLower()
          "$hash  $exeName" | Out-File -Encoding ascii -NoNewline "$exeName.sha256"

          gh release upload "${{ needs.release-please.outputs.tag_name }}" $exeName "$exeName.sha256"
