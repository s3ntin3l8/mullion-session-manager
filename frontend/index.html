    <!-- viewport-fit=cover lets content draw under the iOS status bar/home
         indicator instead of leaving a hard black bar there in standalone
         mode — see styles.css's mobile media query for the matching
         env(safe-area-inset-*) padding this requires on every fixed-
         position mobile chrome element. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mullion</title>
    <meta
      name="description"
      content="A self-hosted, tiled, persistent browser dashboard for host-run AI CLI terminals (Claude Code, Codex, opencode, ...)."
    />
    <meta name="theme-color" content="#0e9f6e" />
    <!-- iOS home-screen install: Safari ignores site.webmanifest's display
         mode entirely and needs its own apple-mobile-web-app-* meta trio to
         go fullscreen/standalone. mobile-web-app-capable is the (newer,
         cross-browser) non-prefixed equivalent Chrome/Android also read. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mullion" />
    <!-- Issue #87 / A5 — corrects the iOS standalone status-bar style for
         the light theme, synchronously, before iOS's own separate read of
         the apple-mobile-web-app-status-bar-style meta tag above at
         standalone launch. Used to be an inline <script> block here, but
         the production CSP (src/plugins/security.ts) sends
         `script-src 'self'` with no 'unsafe-inline'/nonce/hash, which
         silently blocked it outright — see frontend/public/theme-hint.js
         for the full rationale and why this must stay a plain
         `<script src>` (no defer/async/module) in this exact position:
         AFTER the meta tag in document order (so document.querySelector
         can find it — the script executes synchronously during parsing,
         before the meta tag exists if placed any earlier), but still
         parser-blocking so it finishes correcting the attribute well
         before iOS's own later read of it. -->
    <script src="/theme-hint.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

         CSS pixels the app itself ever sees). Generated via

    <!-- crossorigin="use-credentials" is load-bearing behind the Traefik +
         Authentik forwardAuth deployment documented in deploy/: without it
         the browser fetches the manifest with credentials omitted, the
         outpost 302s that request to the IdP, the browser discards the
         redirected response as an invalid manifest, and the install
         prompt silently never appears. Harmless same-origin without a
         proxy in front. -->
    <link rel="manifest" href="/site.webmanifest" crossorigin="use-credentials" />
    <!-- B1 — Geist(+Mono), JetBrains Mono, and IBM Plex Mono used to load
         from fonts.googleapis.com/fonts.gstatic.com here. Self-hosted now
         (see src/main.tsx's @fontsource imports) — this is a self-hosted,
         typically LAN/VPN-only dashboard, so a third-party font CDN was a
         render-blocking dependency on every load, a hard failure mode on
         an air-gapped host, and a per-load ping to Google. Geist(+Mono)
         power the app chrome; JetBrains Mono/IBM Plex Mono are additional
         terminal-font choices offered in Settings -> Appearance (see
         frontend/src/TerminalPane.tsx). SF Mono/Menlo aren't web fonts —
