<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets content draw under the iOS status bar/home
         indicator instead of leaving a hard black bar there in standalone
         mode — see styles.css's mobile media query for the matching
         env(safe-area-inset-*) padding this requires on every fixed-
         position mobile chrome element. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mullion</title>
    <meta
      name="description"
      content="A self-hosted, tiled, persistent browser dashboard for host-run AI CLI terminals (Claude Code, Codex, opencode, ...)."
    />
    <meta name="theme-color" content="#0e9f6e" />
    <!-- iOS home-screen install: Safari ignores site.webmanifest's display
         mode entirely and needs its own apple-mobile-web-app-* meta trio to
         go fullscreen/standalone. mobile-web-app-capable is the (newer,
         cross-browser) non-prefixed equivalent Chrome/Android also read. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mullion" />
    <!-- Issue #87 — iOS reads apple-mobile-web-app-status-bar-style ONCE at
         standalone launch and never re-reads it, so a React effect can't
         correct it: it always runs after iOS has already applied the
         static value above, which forces white status-bar glyphs
         unconditionally — unreadable against the light theme's near-white
         toolbar. This has to run synchronously during initial parse,
         before iOS's read, hence a plain inline script rather than app
         code. "crs.themeHint" must match store.ts's THEME_HINT_KEY — this
         script can't import it (index.html's inline scripts aren't part of
         Vite's module graph). Defaults to the black-translucent/dark-theme
         value on any error (missing localStorage, disabled storage, etc.)
         rather than guessing light. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("crs.themeHint") === "light") {
            var meta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
            if (meta) meta.setAttribute("content", "default");
          }
        } catch {
          /* localStorage unavailable — keep the static black-translucent default */
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#0e9f6e" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Geist(+Mono) power the app chrome; JetBrains Mono/IBM Plex Mono are
         additional terminal-font choices offered in Settings -> Appearance
         (see frontend/src/TerminalPane.tsx). SF Mono/Menlo aren't web fonts
         — they resolve to the OS's own system monospace stack instead. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
