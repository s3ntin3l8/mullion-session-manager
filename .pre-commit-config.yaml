repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      # Enforces this repo's "never commit directly to main" rule (see
      # CLAUDE.md's Git workflow section) locally, not just via branch
      # protection on the remote — catches the mistake before a push even
      # happens. Default protected branches (master, main) already cover
      # this repo's default branch; no args needed.
      - id: no-commit-to-branch

  - repo: local
    hooks:
      # `files:` below is path-scoped per workspace (backend = anything
      # outside frontend/, frontend = anything under it) rather than the
      # old path-blind `types_or:`, which triggered ALL FOUR lint/typecheck
      # hooks (plus both test hooks) off of any .ts/.tsx/.js/.jsx change
      # anywhere in the repo — so a frontend-only commit paid for a full
      # backend lint+typecheck it couldn't possibly need, and vice versa.
      # Root-level backend config files (eslint.config.js, vitest.config.ts,
      # tsconfig.json, drizzle.config.ts, ...) still match the backend
      # pattern since they live outside frontend/, preserving today's
      # trigger behavior for repo-root changes.
      - id: npm-lint
        name: eslint (backend)
        entry: npm run lint
        language: system
        files: '^(?!frontend/).*\.(ts|tsx|js|jsx|mjs|cjs)$'
        pass_filenames: false
        stages: [pre-commit]

      - id: npm-lint-frontend
        name: eslint (frontend)
        entry: npm --prefix frontend run lint
        language: system
        files: '^frontend/.*\.(ts|tsx|js|jsx)$'
        pass_filenames: false
        stages: [pre-commit]

      # Issue #647 / roadmap 7.8 — added while hardening scripts/self-update.sh
      # (the agent auto-update mechanism). Uses the already-installed system
      # `shellcheck` binary, same "language: system" convention as every
      # other hook in this local repo block, rather than a pre-commit-managed
      # external repo hook that would need network access to fetch. Repo-wide
      # `*.sh` scope (not just scripts/) so deploy/install.sh and any future
      # shell script are covered too; see .shellcheckrc for the one
      # project-level suppression this required.
      - id: shellcheck
        name: shellcheck (shell scripts)
        entry: shellcheck
        language: system
        files: '\.sh$'
        stages: [pre-commit]

      - id: npm-typecheck
        name: typecheck (backend)
        entry: npm run typecheck
        language: system
        files: '^(?!frontend/).*\.(ts|tsx)$'
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: npm-typecheck-frontend
        name: typecheck (frontend)
        entry: npm --prefix frontend run typecheck
        language: system
        files: '^frontend/.*\.(ts|tsx)$'
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: npm-format-check
        name: prettier (format check)
        entry: npm run format:check
        language: system
        pass_filenames: false
        stages: [pre-push]

      # Issue #942 — guards against GEMINI.md/AGENTS.override.md silently
      # re-acquiring a content-bearing copy of AGENTS.md's own briefing
      # region (see the script's own header comment for the full
      # reasoning); AGENTS.md itself is no longer read by this check at all,
      # so it isn't in the trigger pattern below. This hook is the fast
      # staged-file path; the unconditional working-tree probe that also
      # catches an untracked AGENTS.override.md (e.g. one just created by
      # the Agent Rules Editor, never staged) comes from `npm run lint`'s
      # check:briefing-sync step. Deliberately kept `files:`-scoped rather
      # than `always_run: true`, per this repo's file-scoped hook convention
      # (see CLAUDE.md's Worktrees section).
      - id: briefing-sync
        name: no content-bearing briefing mirror/override (GEMINI.md / AGENTS.override.md)
        entry: node scripts/check-briefing-sync.mjs
        language: system
        files: '^(AGENTS\.override|GEMINI)\.md$'
        pass_filenames: false
        stages: [pre-commit]

      - id: npm-test
        name: vitest (unit tests, backend)
        entry: npm run test
        language: system
        files: '^(?!frontend/).*\.(ts|tsx|js|jsx|mjs|cjs)$'
        pass_filenames: false
        stages: [pre-push]

      - id: npm-test-frontend
        name: vitest (unit tests, frontend)
        entry: npm --prefix frontend run test
        language: system
        files: '^frontend/.*\.(ts|tsx|js|jsx)$'
        pass_filenames: false
        stages: [pre-push]
