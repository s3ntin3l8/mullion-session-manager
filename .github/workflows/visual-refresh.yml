name: Visual refresh

# Weekly: regenerate the README and PWA screenshots (`make screenshots`) and, only when an image changed by more
# than the pixel tolerance, open or update one rolling pull request from `bot/refresh-screenshots`. The `baselines`
# job does the same for the committed visual baselines (`make visual-baseline`, PR from `bot/refresh-baselines`):
# the safety net for a UI PR that moved a baseline scene and forgot `/update-baselines`. The mechanics, the
# tolerance and the self-approval of the PR's held checks live in the shared workflow in s3ntin3l8/.github
# (visual-refresh.yml); `workflow_dispatch` runs both on demand.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  refresh:
    if: ${{ !github.event.repository.fork }}
    uses: s3ntin3l8/.github/.github/workflows/visual-refresh.yml@main
    with:
      node-version: "26"
      title: "chore(uiux): refresh screenshots"

  # After the screenshots job, never beside it: the shared workflow runs one refresh at a time per repo, and a
  # third queued run would be dropped. `!cancelled()` so a failed screenshots refresh does not skip this one.
  baselines:
    needs: refresh
    if: ${{ !cancelled() && !github.event.repository.fork }}
    uses: s3ntin3l8/.github/.github/workflows/visual-refresh.yml@main
    with:
      node-version: "26"
      target: visual-baseline
      paths: visual/baselines
      branch: bot/refresh-baselines
      title: "chore(uiux): refresh visual baselines"
      allow-json: true
