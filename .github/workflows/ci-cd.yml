name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-node:
    permissions:
      contents: read
    uses: s3ntin3l8/.github/.github/workflows/ci-node.yml@main
    with:
      node-version: "26"
      typecheck-script: "typecheck"
      format-check-script: "format:check"
      test-script: "test:coverage"
      # Line coverage is at ~92% as of M5 (see plan) — 80 is a real floor with
      # headroom to add code without CI being fragile, not a cosmetic bump
      # off the template's starter 0.
      coverage-fail-under: "80"
      # Test measured at ~50s of this job's ~122s total (of 96 files/1484
      # tests) — 2-way sharding splits it across a parallel test-shard
      # matrix + a test-merge job that re-combines coverage and enforces
      # coverage-fail-under once over the union (never per-shard). Safe to
      # enable: vitest.config.ts's coverage.reporter already includes
      # "json", the reusable workflow's stated requirement for shard-merge.
      # IMPORTANT: enabling this moves the actual test run + coverage gate
      # from `test-node / lint-and-test` to a NEW job, `test-node /
      # test-merge` — branch protection's required status checks on main
      # must include `test-node / test-merge` (added alongside the
      # pre-existing three) or a broken test suite could merge silently,
      # since lint-and-test itself still only runs lint/typecheck/build
      # once sharded and would report green regardless.
      test-shards: "2"
      strict-checks: true
    secrets: inherit # pragma: allowlist secret

  test-frontend:
    permissions:
      contents: read
    uses: s3ntin3l8/.github/.github/workflows/ci-node.yml@main
    with:
      node-version: "26"
      working-directory: "frontend"
      cache-dependency-path: "frontend/package-lock.json"
      typecheck-script: "typecheck"
      test-script: "test:coverage"
      # Measured at 80.21% line coverage as of this PR (frontend/vitest.config.ts's
      # new coverage block) — 70 leaves ~10 points of headroom to add
      # uncovered code without CI going red on routine changes, same
      # philosophy as test-node's own 80-against-~92% floor above (a real
      # floor with room to breathe, not a cosmetic bump off 0). No sharding
      # here (frontend's suite runs in well under lint-and-test's 10-minute
      # timeout as a single job), so unlike test-node this doesn't need
      # test-shards/test-merge.
      coverage-fail-under: "70"
      strict-checks: true
    secrets: inherit # pragma: allowlist secret

  # Issue #407 (B3 of the audit remediation plan) — runs the opt-in e2e
  # suite (vitest.e2e.config.ts / `make test-e2e`, see test/e2e/README.md)
  # in CI. A real, multi-step job rather than a `with:` tweak to test-node
  # above — same "no upstream reusable workflow for this" exception class
  # as release-please.yml's build-tarball job (see that job's own comment):
  # ci-node.yml's reusable `lint-and-test` job has no hook to run an
  # arbitrary setup command (e.g. `playwright install`) before its Test
  # step, and this repo can't add one without editing s3ntin3l8/.github,
  # which is out of this PR's reach. The e2e suite itself needs nothing
  # else CI-unfriendly — test/e2e/multi-host.e2e.test.ts's own comment
  # documents that dtach/systemd-run are mocked throughout (real process
  # lifecycle is deliberately out of this suite's scope, see
  # test/e2e/README.md's "What stays manual" section), so a stock
  # ubuntu-latest runner with a real Chromium is sufficient.
  #
  # Deliberately NOT added to docs/ci-cd.md's required-status-checks list yet:
  # this is the suite's first run anywhere outside a developer's own
  # machine, so it needs a stretch of real, unattended CI runs (network
  # variance on the Chromium download, shared-runner resource limits under
  # vitest.e2e.config.ts's `fileParallelism: false` real-browser tests) to
  # prove it isn't flaky before every future merge is gated on it.
  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      # Caches the downloaded Chromium binary (not the OS-level deps
      # `--with-deps` also installs below, which don't persist across the
      # runner's ephemeral filesystem anyway) — keyed off a hash of the
      # whole root package-lock.json (the pinned `playwright` version lives
      # in there, so a version bump invalidates the cache automatically),
      # not restricted to just the playwright entry: hashFiles() can't hash
      # a sub-field, only whole files. No restore-keys fallback, so an
      # unrelated dependency bump costs a full re-download rather than
      # silently reusing a stale browser build under a partial-match key.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      # PR #966 — install the pinned opencode version the
      # `test/e2e/opencode-permission-merge.e2e.test.ts` smoke test
      # asserts against (the opencode merge posture this PR relies on
      # was verified empirically in issue #968 against v1.18.26). A
      # future opencode release that flips the `OPENCODE_CONFIG_CONTENT`
      # `permission` key from deep-merge to shallow-replace will fail
      # the test and force a re-verification before the version pin is
      # bumped. Same posture as the Playwright install above: a real
      # binary the test invokes via `opencode debug config`, not a
      # mock.
      #
      # Hermes review, PR #966 — uses a dedicated workspace
      # (test/e2e/opencode/) with its own package-lock.json rather
      # than `npm install -g opencode-ai@1.18.26` so the integrity
      # hash is locked in `package-lock.json` and enforced by `npm ci`
      # (a registry republish of the 1.18.26 tag with different
      # content would fail EINTEGRITY here, not silently install a
      # tampered binary). When bumping the version, regenerate the
      # lockfile with `cd test/e2e/opencode && rm -rf node_modules
      # package-lock.json && npm install --package-lock-only` against
      # the new version and commit.
      - name: Install opencode (pinned, integrity-checked)
        working-directory: test/e2e/opencode
        run: npm ci
      # Make the locally-installed `opencode` binary the one PATH
      # resolves, so the test/e2e test's bare `execFileSync("opencode")`
      # call hits the integrity-checked binary rather than whatever
      # happens to be on the runner's PATH already.
      - name: Prepend local opencode to PATH
        working-directory: test/e2e/opencode
        run: echo "$(pwd)/node_modules/.bin:$PATH" >> "$GITHUB_PATH"
      - name: Run e2e suite
        run: npm run test:e2e

  # Round 3 (PR2/PR3, Windows SEA) — the counterpart to test-e2e's own
  # "no upstream reusable workflow for this" exception above: real
  # verification of the two things `test-node` (ubuntu-latest) structurally
  # cannot exercise — an actual `schtasks.exe` round trip, and the Node SEA
  # binary (scripts/build-helper-sea.mjs) actually executing at all. This
  # retires the "no local verification path for schtasks.exe" caveat
  # ssh-agent-helper-install.mjs's own header comment and docs/ssh-agent.md
  # have both carried since #879.
  #
  # Deliberately NOT added to docs/ci-cd.md's required-status-checks list yet —
  # same reasoning as test-e2e above: this is the job's first run anywhere
  # outside a developer's own machine (this repo's CI has never run on a
  # Windows runner before), so it needs a stretch of unattended real runs
  # before every future merge is gated on it.
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build mullion-helper.exe
        run: npm run build:helper-sea
      # Confirms the bundle actually runs as a SEA at all — the one thing
      # genuinely uncertain building this from Linux-only dev/CI: whether
      # `process.argv` inside a real SEA is shaped the way helper-main.mjs
      # assumes (argv[2] onward = the noun/verb/args this binary parses).
      # Exit code 2 + the exact usage message is `helper-main.mjs`'s own
      # documented behavior for an unrecognized noun.
      - name: Smoke test — unknown command
        shell: pwsh
        run: |
          $exe = "build\helper-sea\mullion-helper.exe"
          $output = & $exe bogus 2>&1
          $code = $LASTEXITCODE
          Write-Host $output
          if ($code -ne 2) { throw "expected exit code 2, got $code" }
          $joined = $output -join "`n"
          if ($joined -notmatch "unknown command: bogus") { throw "unexpected output: $joined" }
          # GitHub Actions' pwsh shell fails a step on whatever $LASTEXITCODE
          # is when the script ends, regardless of whether the `if` checks
          # above already validated it as the EXPECTED value — the exit code
          # 2 asserted above would otherwise be re-surfaced as this step's
          # own (spurious) failure. Reset it now that success is confirmed.
          exit 0
      # Round 4 (issue #871) — real reg.exe round trip against the HKCU Run
      # key: install (registers the autostart entry AND starts the helper
      # detached), query it, uninstall, confirm it's gone. This replaced a
      # Scheduled Task round trip (`schtasks /Create`) that passed on this
      # very runner while being unable to catch the actual production bug:
      # windows-latest runs as `runneradmin`, an ELEVATED administrator, so
      # `schtasks /Create` succeeding here proved nothing about a real,
      # non-elevated end user — and on a real non-elevated Administrator
      # account (confirmed on real hardware) it unconditionally fails
      # "Access is denied" (a UAC filtered-token effect, not a bug in the
      # generated task XML). `HKCU` has no equivalent elevation dependency
      # — it's per-user and always writable by its owner regardless of
      # admin/standard/elevated status — so this round trip has no
      # privilege gap left for CI's own elevation to mask. See
      # src/cli/ssh-agent-helper-install.mjs's header comment for the full
      # story.
      - name: reg round trip — install, query, uninstall
        shell: pwsh
        env:
          MULLION_HELPER_STATE_DIR: ${{ runner.temp }}\mullion-helper-state
        run: |
          # `2>&1` + Write-Host on every native call, not a bare `& $exe ...`
          # — self-review, this exact step's own failure: PowerShell 7.3+'s
          # `$PSNativeCommandUseErrorActionPreference` (default true)
          # intercepts a native command's stderr for its own error-record
          # handling when a call isn't redirected, and a real failure here
          # showed up as a bare "exit code 1" with the child's own stderr
          # (the actual reason) never reaching the Actions log at all — the
          # exact "exit code 1, zero diagnosis" failure mode this whole PR
          # exists to fix, just relocated to this CI script instead of the
          # installer. The smoke-test step above already uses this pattern
          # for exactly this reason; this step now matches it everywhere a
          # native command's output matters for diagnosis.
          $exe = "build\helper-sea\mullion-helper.exe"
          $installOutput = & $exe helper install --ssh-auth-sock "\\.\pipe\openssh-ssh-agent" 2>&1
          Write-Host ($installOutput -join "`n")
          if ($LASTEXITCODE -ne 0) { throw "helper install failed with exit code $LASTEXITCODE" }

          # Round 4 (issue #871, mullion-reviewer round) — the registered
          # command line crosses TWO real argv parsers before it's actually
          # this string (Node's own child-process command-line construction,
          # then reg.exe's own CommandLineToArgvW-based parsing of `/d`) —
          # a hazard the retired Scheduled Task's XML file never had (it was
          # written directly, never round-tripped through a second real
          # parser). The unit tests can only assert what's handed to a
          # STUBBED spawnSync; asserting exit code alone here would miss a
          # value silently mangled by that second parse. Check the actual
          # content a real `reg.exe` stored, not just that a value exists.
          $regOutput = ((reg query "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v MullionHelper 2>&1) -join "`n")
          if ($LASTEXITCODE -ne 0) { throw "reg query found no registered autostart entry after install: $regOutput" }
          if (-not $regOutput.Contains("\\.\pipe\openssh-ssh-agent")) { throw "registered autostart command lost the --ssh-auth-sock value: $regOutput" }
          if (-not $regOutput.Contains("mullion-helper.exe")) { throw "registered autostart command does not reference mullion-helper.exe: $regOutput" }
          # Issue #871 — the registered command must carry --detach: it's
          # what makes the logon-launched helper re-spawn itself with no
          # console instead of inheriting/allocating one that, when closed,
          # kills it. See the next step for the actual behavioral proof
          # (a real --detach invocation surviving and logging).
          if (-not $regOutput.Contains("--detach")) { throw "registered autostart command is missing --detach: $regOutput" }

          $uninstallOutput = & $exe helper uninstall 2>&1
          Write-Host ($uninstallOutput -join "`n")
          if ($LASTEXITCODE -ne 0) { throw "helper uninstall failed with exit code $LASTEXITCODE" }

          reg query "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v MullionHelper 2>$null
          if ($LASTEXITCODE -eq 0) { throw "autostart entry still registered after uninstall" }
          # Same reset as the smoke-test step above — the LAST native call
          # here is EXPECTED to fail (proving the entry is really gone), so
          # $LASTEXITCODE is non-zero on the success path and would
          # otherwise fail this step despite every assertion having passed.
          exit 0

      # Issue #871 — behavioral proof that --detach actually backgrounds the
      # helper with no console and a real log, not just that the registered
      # command string contains the flag (the assertion in the step above).
      # A well-formed but unreachable (port 1, nothing ever listens there)
      # credential puts `helper run` into its own reconnect ladder
      # (RECONNECT_DELAYS_MS, ssh-agent-helper.mjs) forever instead of
      # exiting, which is what lets this step observe "the process survives
      # past the --detach bootstrap returning" rather than racing a real
      # connection attempt this Linux-only dev/CI environment has no way to
      # satisfy.
      - name: "--detach backgrounds the helper with no console, and logs to a file"
        shell: pwsh
        env:
          MULLION_HELPER_STATE_DIR: ${{ runner.temp }}\mullion-helper-detach-state
        run: |
          $exe = "build\helper-sea\mullion-helper.exe"
          New-Item -ItemType Directory -Force -Path $env:MULLION_HELPER_STATE_DIR | Out-Null
          # Shape validated by loadCredential's own isValidHttpBaseUrl/
          # isValidBridgeId/isValidSessionToken/isValidExpiresAt
          # (src/cli/ssh-agent-helper.mjs) — a malformed credential would be
          # silently treated as "not paired", never reaching the reconnect
          # loop this step depends on.
          $credential = @{
            baseUrl   = "http://127.0.0.1:1"
            bridgeId  = "00000000-0000-0000-0000-000000000000"
            sessionId = ("0" * 64)
            expiresAt = (Get-Date).AddDays(1).ToString("o")
          } | ConvertTo-Json
          Set-Content -Path (Join-Path $env:MULLION_HELPER_STATE_DIR "ssh-agent-bridge.json") -Value $credential -Encoding ascii

          $output = & $exe helper run --detach --ssh-auth-sock "\\.\pipe\openssh-ssh-agent" 2>&1
          $code = $LASTEXITCODE
          Write-Host ($output -join "`n")
          if ($code -ne 0) { throw "helper run --detach exited $code instead of backgrounding successfully" }
          if (($output -join "`n") -notmatch "started in the background") { throw "missing 'started in the background' confirmation" }

          Start-Sleep -Seconds 2
          $proc = Get-Process -Name "mullion-helper" -ErrorAction SilentlyContinue
          if (-not $proc) { throw "backgrounded helper is not running two seconds later — --detach's re-spawned child did not survive" }

          $logPath = Join-Path $env:MULLION_HELPER_STATE_DIR "helper-run.log"
          if (-not (Test-Path $logPath)) { throw "helper-run.log was not created — --detach's child did not write where it was told to" }
          $logContent = Get-Content $logPath -Raw
          if ($logContent -notmatch "connect failed") { throw "helper-run.log does not show the reconnect ladder retrying against the unreachable port: $logContent" }

          $proc | Stop-Process -Force
          exit 0

      # Round 3 (PR3, Windows installer) — builds deploy/windows/mullion-
      # helper.iss with the SAME mullion-helper.exe built above, then
      # actually RUNS the produced installer and its own auto-generated
      # uninstaller, silently. Inno Setup 6.7.1 is preinstalled on
      # windows-latest (confirmed via the runner-images tool inventory) and
      # on PATH as `iscc`.
      - name: Build Windows installer
        shell: pwsh
        run: iscc deploy\windows\mullion-helper.iss
      # `/VERYSILENT /SUPPRESSMSGBOXES` — not just for CI: this is also the
      # documented way anyone (an enterprise provisioning script, this job)
      # runs an Inno Setup installer fully unattended. Every ShowMsg() call
      # in the .iss's own [Code] additionally checks WizardSilent() and
      # skips the dialog entirely rather than relying on /SUPPRESSMSGBOXES
      # alone (which auto-answers a MsgBox rather than truly suppressing
      # it) — see that procedure's own comment for why the distinction
      # matters. No pairing payload is supplied here, so this exercises the
      # "installed but not yet paired" branch of CurStepChanged.
      - name: Run the installer silently and verify it actually installed
        shell: pwsh
        run: |
          $installer = Get-ChildItem "build\installer\mullion-helper-setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "no installer output found under build\installer" }
          # Setup.exe is a GUI-subsystem executable, unlike mullion-helper.exe
          # (console) above — $LASTEXITCODE via the `&` call operator is
          # documented as unreliable for GUI processes (came back $null on
          # this job's first real run, not even a nonzero code). Start-Process
          # -Wait -PassThru is the robust way to actually wait on a GUI
          # process and read its real exit code.
          $logPath = Join-Path $env:RUNNER_TEMP "install.log"
          $proc = Start-Process -FilePath $installer.FullName -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/LOG=$logPath") -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "installer exited $($proc.ExitCode)" }

          $exePath = "$env:LOCALAPPDATA\Mullion\mullion-helper.exe"
          if (-not (Test-Path $exePath)) { throw "mullion-helper.exe was not installed to $exePath" }

          reg query "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v MullionHelper
          if ($LASTEXITCODE -ne 0) { throw "installer did not register the MullionHelper autostart entry" }

          # Round 4 (issue #871, Hermes review on the original silent-
          # failure bug) — the installer's own [Code] now captures every
          # `helper pair`/`helper install` invocation's stdout+stderr to
          # this log, specifically so a failure like the one that shipped
          # undiagnosable (both post-install steps failing with a bare
          # "exit code 1" and nothing else) can't happen again silently.
          # No pairing payload was supplied above, so this run exercises
          # the "not yet paired" branch — only `helper install`'s own
          # entry is expected here.
          $diagLog = "$env:LOCALAPPDATA\Mullion\install-diagnostics.log"
          if (-not (Test-Path $diagLog)) { throw "install-diagnostics.log was not written" }
          $diagContent = Get-Content $diagLog -Raw
          if ($diagContent -notmatch "helper install\s+exit=0") { throw "install-diagnostics.log missing a successful 'helper install' entry: $diagContent" }

          # Issue #904 — no pairing payload was supplied above, so nothing
          # real got written here; drop a dummy credential file in the same
          # spot `helper pair` would (stateDir() IS {app} on Windows, PR3's
          # own DisableDirPage comment) so the uninstall step below can prove
          # the real installer's [UninstallRun] -> `helper uninstall` really
          # forgets it, not just the unit-tested runUninstall() in isolation.
          "{}" | Out-File -Encoding ascii -NoNewline "$env:LOCALAPPDATA\Mullion\ssh-agent-bridge.json"

      # Round 4 (issue #871, mullion-reviewer round) — re-running the
      # installer silently over an ALREADY-paired laptop, still with no
      # payload supplied, is the real shape of a version upgrade or repair
      # install: the user has no new payload to give because they're
      # already paired. Before this fix, CurStepChanged's blank-payload
      # branch couldn't tell that apart from a genuinely fresh, unpaired
      # install, and told the user to go pair anyway — silently registering
      # a second bridge session if followed. Nothing above exercises a
      # SECOND run against an existing credential file, so this regression
      # had no coverage; this step is that coverage.
      - name: Re-run the installer silently over an already-paired install
        shell: pwsh
        run: |
          $installer = Get-ChildItem "build\installer\mullion-helper-setup-*.exe" | Select-Object -First 1
          $logPath = Join-Path $env:RUNNER_TEMP "reinstall.log"
          $proc = Start-Process -FilePath $installer.FullName -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/LOG=$logPath") -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "re-install exited $($proc.ExitCode)" }

          $logContent = Get-Content $logPath -Raw
          if ($logContent -match "will be installed but not yet paired") {
            throw "re-install over an already-paired laptop showed the fresh-install pairing prompt — the credential-file check regressed"
          }
          if ($logContent -notmatch "installed and paired") {
            throw "re-install over an already-paired laptop did not report itself as paired: $logContent"
          }

      # Inno Setup's generated uninstaller copies ITSELF to a temp location
      # and re-executes before doing the actual work, specifically so it
      # can delete its own original exe — the parent process this step
      # launches can return well before that child finishes. Polling for
      # the exe to actually disappear (rather than trusting the launch
      # call's own exit) is what makes this a real assertion instead of a
      # race that happens to pass.
      - name: Run the auto-generated uninstaller and verify cleanup
        shell: pwsh
        run: |
          $exePath = "$env:LOCALAPPDATA\Mullion\mullion-helper.exe"
          $credPath = "$env:LOCALAPPDATA\Mullion\ssh-agent-bridge.json"
          $uninstaller = "$env:LOCALAPPDATA\Mullion\unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "no uninstaller found at $uninstaller" }
          & $uninstaller /VERYSILENT /SUPPRESSMSGBOXES

          $deadline = (Get-Date).AddSeconds(30)
          while ((Test-Path $exePath) -and ((Get-Date) -lt $deadline)) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $exePath) { throw "mullion-helper.exe still present after uninstall (timed out waiting)" }
          # Issue #904 — [UninstallRun] runs `helper uninstall` BEFORE
          # [Files] removal (Inno Setup's own documented ordering, see that
          # section's comment), so this doesn't need the same disappearance
          # poll above: by the time the exe itself is gone, `helper
          # uninstall` already ran to completion.
          if (Test-Path $credPath) { throw "ssh-agent-bridge.json still present after uninstall" }

          schtasks /Query /TN MullionHelper 2>$null
          if ($LASTEXITCODE -eq 0) { throw "MullionHelper task still registered after uninstall" }
          exit 0

  # Round 4 (issue #820, macOS SEA support) — the macOS counterpart to
  # test-windows above: a real `launchctl bootstrap`/`launchctl bootout`
  # round trip via installLaunchd/uninstallLaunchd on a real macos-latest
  # runner, and the first real exercise anywhere of
  # scripts/build-helper-sea.mjs's own darwin --macho-segment-name postject
  # flag, which existed in code since round 3 but had never actually run —
  # no macOS CI job existed, and postject operates on the real binary
  # format of whatever this same job just built, so there's no way to
  # verify it without real macOS hardware.
  #
  # Deliberately NOT added to docs/ci-cd.md's required-status-checks list yet —
  # same reasoning as test-windows: this is the job's first run anywhere
  # outside a developer's own machine (this repo's CI has never run on a
  # macOS runner before), so it needs a stretch of unattended real runs
  # before every future merge is gated on it.
  test-macos:
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build mullion-helper
        run: npm run build:helper-sea
      # Same "does argv even look like this outside a normal dev/CI Linux
      # process" uncertainty test-windows's own comment describes, now for
      # a real macOS SEA binary.
      - name: Smoke test — unknown command
        run: |
          set -e
          output=$(./build/helper-sea/mullion-helper bogus 2>&1) && code=0 || code=$?
          echo "$output"
          if [ "$code" -ne 2 ]; then echo "expected exit code 2, got $code"; exit 1; fi
          case "$output" in
            *"unknown command: bogus"*) ;;
            *) echo "unexpected output: $output"; exit 1 ;;
          esac
      # Real launchctl round trip: install (registers a REAL launchd agent
      # for this runner's own user), confirm it's loaded, uninstall, confirm
      # it's gone. A fake --ssh-auth-sock is fine here — install/uninstall
      # only persist the value into the plist, never dial it (same posture
      # as test-windows's own schtasks round trip not asserting /Run
      # actually started the process).
      #
      # MULLION_HELPER_STATE_DIR only redirects stateDir() consumers (the
      # credential file, the log path) — launchdPlistPath() is hardcoded to
      # ~/Library/LaunchAgents (self-review, PR #916), unaffected by this
      # var, same as a real laptop install always writes there. Fine on
      # GitHub's ephemeral, single-use macOS runners; would NOT actually
      # isolate this round trip if this job pattern were ever copied to a
      # persistent/self-hosted macOS runner.
      - name: launchctl round trip — install, query, uninstall
        env:
          MULLION_HELPER_STATE_DIR: ${{ runner.temp }}/mullion-helper-state
        run: |
          set -e
          EXE=./build/helper-sea/mullion-helper
          LABEL="gui/$(id -u)/de.s3ntin3l8.mullion-helper"
          "$EXE" helper install --ssh-auth-sock /tmp/fake-agent.sock

          if ! launchctl print "$LABEL" >/dev/null 2>&1; then
            echo "launchctl print found no registered job in $LABEL after install"
            exit 1
          fi

          "$EXE" helper uninstall

          if launchctl print "$LABEL" >/dev/null 2>&1; then
            echo "job still registered in $LABEL after uninstall"
            exit 1
          fi

      # Issue #1054 — the round-trip the SSH-agent bridge fixes from rounds
      # 1–3 (Retry-After renewal, bound sockets, health checks, TOCTOU
      # revocation, validation, sign-only filter, ...) actually need: a
      # full `mullion helper run` exercise against a real primary, with a
      # real sign request round-tripped through the materialized bridge
      # socket AND a real reconnect-ladder cycle after a simulated drop.
      # Without this, every prior CI round on macOS verified the
      # `install`/`uninstall` round trip and a `bogus` smoke test only —
      # the actual bridge flow had NO end-to-end coverage here, even
      # though it's the whole reason the .pkg ships.
      #
      # scripts/test-helper-run-e2e.mjs boots a real primary in-process
      # (binding to a chosen loopback port, isolated SESSIONS_DIR so the
      # sign request's materialized bridge socket doesn't collide with
      # anything else on this runner), pairs via the spawned binary,
      # runs the spawned binary with `--json-events`, drives a real
      # SSH_AGENTC_SIGN_REQUEST through the primary's materialized
      # ssh-agent.sock, asserts the bytes reach the helper's fake local
      # agent AND the reply echoes back, then closes the bridge from
      # the server side and asserts the helper's `disconnected` →
      # `connected` cycle through the reconnect ladder fires. npx tsx
      # (not a separate build step) keeps this isolated to a single
      # CI step that finishes in seconds, same posture the other
      # macOS-specific jobs take with their own ad-hoc shell scripts.
      #
      # 14321 is a real, unprivileged, ephemeral TCP port outside the
      # `ephemeral port range` so the kernel will never auto-allocate it
      # to another service mid-run. Anything in the dynamic range would
      # race against the runner's own sockets.
      - name: "mullion helper run end-to-end against a real primary"
        run: npx tsx scripts/test-helper-run-e2e.mjs --port 14321 --timeout-ms 30000

      # Round 4 (PR5, issue #820) — the macOS counterpart to test-windows's own Inno
      # Setup install/uninstall verification: build the real .pkg
      # (deploy/macos/build-pkg.sh, the SAME mullion-helper binary built
      # above), install it silently exactly the way an enterprise
      # provisioning script would (`installer -pkg ... -target /`, no
      # Finder involved), and confirm postinstall's root-to-console-user
      # launchctl transition actually registered the job — not just that
      # the .pkg installer exited 0, which pkgbuild's default "no scripts"
      # posture would also do even if postinstall silently failed to
      # register anything.
      - name: Build and install the macOS .pkg, verify it registered
        run: |
          set -e
          deploy/macos/build-pkg.sh 0.0.0-ci

          PKG=build/installer/mullion-helper-0.0.0-ci.pkg
          if [ ! -f "$PKG" ]; then
            echo "expected a built package at $PKG"
            exit 1
          fi

          sudo installer -pkg "$PKG" -target /

          if [ ! -x /usr/local/bin/mullion-helper ]; then
            echo "mullion-helper was not installed to /usr/local/bin"
            exit 1
          fi

          # pkgbuild's default --ownership recommended should normalize this
          # to root:wheel regardless of how build-pkg.sh staged it (as the CI
          # user, unprivileged) — assert it rather than just trusting the
          # default (self-review, PR #918).
          OWNER="$(stat -f '%Su:%Sg' /usr/local/bin/mullion-helper)"
          if [ "$OWNER" != "root:wheel" ]; then
            echo "expected /usr/local/bin/mullion-helper to be owned root:wheel, got $OWNER"
            exit 1
          fi

          # installer(8) does not stream a package script's own stdout back
          # to the invoking shell — it only reaches /var/log/install.log —
          # so this is the only way to confirm postinstall's own
          # console-user detection actually fired, not just that
          # registration happened to succeed for some other reason
          # (self-review, PR #918).
          if ! sudo grep -q "mullion-helper: resolved console user" /var/log/install.log; then
            echo "postinstall's console-user-detection marker not found in /var/log/install.log"
            exit 1
          fi
          sudo grep "mullion-helper: resolved console user" /var/log/install.log

          LABEL="gui/$(id -u)/de.s3ntin3l8.mullion-helper"
          if ! launchctl print "$LABEL" >/dev/null 2>&1; then
            echo "postinstall did not register $LABEL — the root-to-console-user launchctl transition may have silently taken the 'could not determine console user' fallback branch"
            exit 1
          fi

          # Cleanup — mirrors the direct round trip above; run as the same
          # user postinstall registered the job as, same reasoning (`-H`
          # pins $HOME the same way postinstall itself now does).
          sudo launchctl asuser "$(id -u)" sudo -u "$(id -un)" -H \
            /usr/local/bin/mullion-helper helper uninstall
          if launchctl print "$LABEL" >/dev/null 2>&1; then
            echo "job still registered in $LABEL after uninstall"
            exit 1
          fi
          # deploy/macos/build-pkg.sh's own postinstall never removes
          # /usr/local/bin/mullion-helper itself — `pkgutil --forget` is
          # macOS's own uninstall path for that (docs/ssh-agent.md), not
          # this job's job to exercise; nothing here depends on it being
          # gone, this is just documenting why no assertion follows.
