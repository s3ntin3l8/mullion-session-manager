name: Release Please

on:
  push:
    branches:
      - main
  # #744 — lets Mullion's own "Run release-please" button
  # (POST /api/projects/:id/release/run) dispatch this job on demand,
  # without waiting for the next push to main. Only the caller here needs
  # this trigger; the org's reusable workflow it calls into
  # (s3ntin3l8/.github/.github/workflows/release-please.yml) stays
  # workflow_call-only.
  workflow_dispatch:

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
    uses: s3ntin3l8/.github/.github/workflows/release-please.yml@main

  # Builds and attaches the versioned-release tarball (see deploy/README.md
  # and src/services/update-checker.ts) that self-update.sh downloads and
  # installs. This is a real multi-step job rather than a call into
  # s3ntin3l8/.github's reusable workflows, unlike every other job in this
  # file — a deliberate, deployment-target-specific exception to this repo's
  # normal "thin caller" CI convention (there's no reusable "build a tarball
  # and upload it to a release" workflow upstream, and this artifact only
  # exists for this repo's own native-host deploy path, not something other
  # repos in the org would share).
  #
  # NOT triggered via `on: release: published` — GitHub does not fire that
  # event for a release created by the default GITHUB_TOKEN (the anti-
  # recursion rule release-please itself relies on), so that trigger would
  # simply never run. Gating on release-please's own `release_created`
  # output is the only shape that works.
  build-tarball:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"

      - name: Build backend
        run: |
          npm ci
          npm run build

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Assemble release tarball
        run: |
          set -euo pipefail
          # Strip the leading "v" release-please's tag carries — matches the
          # bare MAJOR.MINOR.PATCH package.json's own "version" field uses
          # (see src/services/update-checker.ts's parseVersion).
          version="${VERSION#v}"
          # Staged so self-update.sh's `tar -xzf ... -C "$RELEASE_DIR"` lands
          # dist/, frontend/dist/, drizzle/, scripts/, package.json directly
          # under the release dir — the same layout src/plugins/env.ts's
          # cwd-relative defaults (FRONTEND_DIST=./frontend/dist,
          # drizzle/ via path.resolve("drizzle")) expect when
          # WorkingDirectory is that release dir. Built outside the repo
          # checkout (../staging) so it's never itself picked up by a later
          # `cp -r`, and tarred with `-C staging .` (no wrapping directory)
          # rather than `tar -czf x.tgz staging/` (which would nest
          # everything one level too deep on extraction).
          staging="../staging"
          rm -rf "$staging" && mkdir -p "$staging/frontend"
          cp -r dist "$staging/dist"
          cp -r frontend/dist "$staging/frontend/dist"
          cp -r drizzle "$staging/drizzle"
          cp -r scripts "$staging/scripts"
          cp package.json package-lock.json "$staging/"
          tar -czf "mullion-${version}.tgz" -C "$staging" .
          # Checksum the tarball as its own asset — self-update.sh and
          # deploy/install.sh both verify against this before extracting
          # (Hermes review, PR #54: "no integrity verification of the
          # downloaded tarball"). Standard sha256sum output format
          # ("<hex>  <filename>") so `sha256sum -c` can verify it directly.
          sha256sum "mullion-${version}.tgz" > "mullion-${version}.tgz.sha256"

      - name: Upload tarball and checksum to the GitHub Release
        run: |
          version="${VERSION#v}"
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            "mullion-${version}.tgz" "mullion-${version}.tgz.sha256"

  # Round 3 (PR2/PR3, Windows SEA) — builds and attaches `mullion-helper.exe`
  # (scripts/build-helper-sea.mjs) the same way build-tarball above attaches
  # the server tarball: a real multi-step job (no reusable upstream
  # workflow for this either), gated on the same release_created output,
  # checksummed the same way. `windows-latest`, not cross-compiled from
  # ubuntu-latest — postject injects into a COPY of process.execPath, so the
  # blob and the host node.exe must come from the same real Windows Node
  # install for the result to actually be a valid PE the OS will run; cross-
  # generating a Windows SEA from Linux isn't an officially supported Node
  # SEA path.
  build-helper-exe:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"

      - name: Build mullion-helper.exe
        run: |
          npm ci
          npm run build:helper-sea

      - name: Smoke test the built exe
        shell: pwsh
        run: |
          $output = & build\helper-sea\mullion-helper.exe bogus 2>&1
          if ($LASTEXITCODE -ne 2) { throw "expected exit code 2, got $LASTEXITCODE" }
          # GitHub Actions' pwsh shell fails a step on whatever $LASTEXITCODE
          # is when the script ends, regardless of the `if` check above
          # having already validated it as the EXPECTED value (2, for an
          # unrecognized verb) — without this, the exe's own designed exit
          # code would re-surface as a spurious failure of THIS step, which
          # would skip the upload step entirely and ship a release with no
          # mullion-helper.exe attached.
          exit 0

      - name: Rename, checksum, and upload to the GitHub Release
        shell: pwsh
        run: |
          $version = $env:VERSION -replace '^v', ''
          $exeName = "mullion-helper-$version.exe"
          Copy-Item "build\helper-sea\mullion-helper.exe" $exeName

          # sha256sum's own output format ("<lowercase-hex>  <filename>"),
          # not PowerShell's default Get-FileHash table — self-update.sh and
          # deploy/install.sh both expect a `sha256sum -c`-compatible file
          # for the tarball's own checksum (see build-tarball above); this
          # asset's checksum matches that same convention so anyone
          # verifying it can use the same one-liner regardless of which
          # release asset they downloaded.
          $hash = (Get-FileHash $exeName -Algorithm SHA256).Hash.ToLower()
          "$hash  $exeName" | Out-File -Encoding ascii -NoNewline "$exeName.sha256"

          gh release upload "${{ needs.release-please.outputs.tag_name }}" $exeName "$exeName.sha256"

      # Round 3 (PR3) — the installer (deploy/windows/mullion-helper.iss)
      # wraps the SAME mullion-helper.exe just built and uploaded above;
      # built as its own release asset the same way, checksummed and
      # uploaded identically. AppVersion is passed explicitly rather than
      # relying on the .iss's own dev-mode fallback, so the installer's
      # own Add/Remove Programs entry and OutputBaseFilename carry the
      # real release version.
      - name: Build and upload the Windows installer
        shell: pwsh
        run: |
          $version = $env:VERSION -replace '^v', ''
          iscc "/DAppVersion=$version" deploy\windows\mullion-helper.iss

          $installerName = "mullion-helper-setup-$version.exe"
          $installerPath = "build\installer\$installerName"
          if (-not (Test-Path $installerPath)) { throw "expected installer at $installerPath" }

          $hash = (Get-FileHash $installerPath -Algorithm SHA256).Hash.ToLower()
          "$hash  $installerName" | Out-File -Encoding ascii -NoNewline "$installerName.sha256"

          gh release upload "${{ needs.release-please.outputs.tag_name }}" $installerPath "$installerName.sha256"

  # Round 4 (PR5, issue #820) — the macOS counterpart to build-helper-exe
  # above: builds mullion-helper (same scripts/build-helper-sea.mjs), then
  # deploy/macos/build-pkg.sh's pkgbuild package around it, checksummed and
  # uploaded identically. `macos-latest`, not cross-built from ubuntu-latest,
  # for the same reason build-helper-exe stays on windows-latest — postject's
  # blob injection operates on the real Mach-O of whatever Node binary this
  # runner's own npm ci pulls down, and there's no cross-platform SEA build
  # path.
  build-helper-pkg:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"

      - name: Build mullion-helper
        run: |
          npm ci
          npm run build:helper-sea

      - name: Smoke test the built binary
        run: |
          set -e
          EXE=./build/helper-sea/mullion-helper

          # Issue #1054 — the original `bogus` smoke test only proved the
          # argv parser recognizes an unknown noun and returns 2. That's
          # real but minimal — a regression in the `helper install`
          # generator, the launchd plist generator, or the bundled
          # SEA's own argv router would slip past a single `bogus`
          # assertion. Augment with three more checks the build
          # artifact has to pass before it ships:

          # 1. Argv shape: `bogus` still returns 2 with the documented
          #    message — the contract ssh-agent-helper.mjs's own
          #    `runHelper` path returns for an unrecognized verb.
          output=$("$EXE" bogus 2>&1) && code=0 || code=$?
          echo "$output"
          if [ "$code" -ne 2 ]; then echo "expected exit code 2 from bogus, got $code"; exit 1; fi
          case "$output" in
            *"unknown command: bogus"*) ;;
            *) echo "unexpected bogus output: $output"; exit 1 ;;
          esac

          # 2. CLI intact: `helper run` without a credential file exits 1
          #    with a clear "not paired yet" message — proving the verb
          #    router (helper-main.mjs's `noun !== "helper"` branch +
          #    runRun's own loadCredential-missing path) is wired. This
          #    is the CLI's documented behavior for an unpaired helper,
          #    and it's what a fresh macOS install sees before the user
          #    runs `helper pair`.
          #
          # Two gotchas, both verified empirically rather than
          # theoretically: (a) runRun's own SSH_AUTH_SOCK check (line 616
          # of ssh-agent-helper.mjs) runs BEFORE loadCredential — so a
          # bare `SSH_AUTH_SOCK=` is NOT enough to reach the
          # "not paired yet" branch, it'd return at the SSH_AUTH_SOCK
          # check first. Pass --ssh-auth-sock explicitly to bypass that
          # gate. (b) MULLION_HELPER_STATE_DIR must point at a directory
          # the runner user owns (and that loadCredential can read) —
          # $RUNNER_TEMP is owned by the runner user and writable, so
          # naming it directly works.
          output=$(MULLION_HELPER_STATE_DIR="$RUNNER_TEMP/mullion-helper-empty" \
            "$EXE" helper run --ssh-auth-sock /tmp/fake-agent.sock 2>&1) && code=0 || code=$?
          echo "$output"
          if [ "$code" -ne 1 ]; then echo "expected exit code 1 from unpaired helper run, got $code"; exit 1; fi
          case "$output" in
            *"not paired yet"*) ;;
            *) echo "unexpected helper run output: $output"; exit 1 ;;
          esac

          # 3. Launchd round trip with the BUILT binary — a real
          #    `launchctl bootstrap` / `launchctl bootout` against the
          #    launchd job plist this build's own install generator
          #    produces. Skips the actual `launchctl kickstart -k` (a CI
          #    runner's non-interactive launchd session may not honor
          #    the kickstart the same way a real interactive logon does;
          #    test-macos's own "launchctl round trip" step explicitly
          #    makes the same trade-off). MULLION_HELPER_STATE_DIR
          #    isolates stateDir() consumers only — launchdPlistPath()
          #    is hardcoded to ~/Library/LaunchAgents (ssh-agent-helper-
          #    install.mjs's own doc), same as test-macos. Fine on the
          #    single-use ephemeral macos-latest runner; not something to
          #    copy to a persistent/self-hosted runner as-is.
          MULLION_HELPER_STATE_DIR="$RUNNER_TEMP/mullion-helper-state" \
            "$EXE" helper install --ssh-auth-sock /tmp/fake-agent.sock
          LABEL="gui/$(id -u)/de.s3ntin3l8.mullion-helper"
          if ! launchctl print "$LABEL" >/dev/null 2>&1; then
            echo "release-please smoke: launchctl did not register $LABEL after install"
            exit 1
          fi
          MULLION_HELPER_STATE_DIR="$RUNNER_TEMP/mullion-helper-state" \
            "$EXE" helper uninstall
          if launchctl print "$LABEL" >/dev/null 2>&1; then
            echo "release-please smoke: $LABEL still registered after uninstall"
            exit 1
          fi

      - name: Build, checksum, and upload the macOS installer
        run: |
          set -e
          version="${VERSION#v}"
          deploy/macos/build-pkg.sh "$version"

          pkgPath="build/installer/mullion-helper-$version.pkg"
          pkgName="mullion-helper-$version.pkg"
          if [ ! -f "$pkgPath" ]; then echo "expected package at $pkgPath"; exit 1; fi

          shasum -a 256 "$pkgPath" | awk -v name="$pkgName" '{print $1 "  " name}' > "$pkgName.sha256"

          gh release upload "${{ needs.release-please.outputs.tag_name }}" "$pkgPath" "$pkgName.sha256"
