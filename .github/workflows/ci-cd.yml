name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Supersede a PR's CI run when a newer commit lands on that PR. Without
# this, every push to a PR branch spawns a full run — five `npm ci`s, the
# whole backend suite, the whole frontend suite and the e2e suite, ~14
# runner-minutes — even when a newer run is already going to report the
# same result for the same branch.
#
# `cancel-in-progress` is deliberately restricted to `pull_request`: a
# post-merge `push` validation run on `main` is never cancelled by a later
# push. That run is the record of what actually landed on the default
# branch, and dropping it would leave `main` unverified.
#
# Cancelling leaves `cancelled` checks on the *old* head SHA. Branch
# protection evaluates the checks on the PR's *current* head SHA, so a
# cancelled run neither satisfies nor breaks a required check — the newest
# run for the head SHA always completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-node:
    permissions:
      contents: read
    uses: s3ntin3l8/.github/.github/workflows/ci-node.yml@main
    with:
      node-version: "26"
      typecheck-script: "typecheck"
      format-check-script: "format:check"
      test-script: "test:coverage"
      # Line coverage is at ~92% as of M5 (see plan) — 80 is a real floor with
      # headroom to add code without CI being fragile, not a cosmetic bump
      # off the template's starter 0.
      coverage-fail-under: "80"
      # Sharding splits the test run across a parallel test-shard matrix +
      # a test-merge job that re-combines coverage and enforces
      # coverage-fail-under once over the union (never per-shard). Safe to
      # enable: vitest.config.ts's coverage.reporter already includes
      # "json", the reusable workflow's stated requirement for shard-merge.
      # IMPORTANT: enabling this moves the actual test run + coverage gate
      # from `test-node / lint-and-test` to a NEW job, `test-node /
      # test-merge` — branch protection's required status checks on main
      # must include `test-node / test-merge` (added alongside the
      # pre-existing three) or a broken test suite could merge silently,
      # since lint-and-test itself still only runs lint/typecheck/build
      # once sharded and would report green regardless.
      #
      # 4 shards, not 2 (2026-10-22 CI audit). The "96 files/1484 tests"
      # figure above is stale: the backend suite is now 314 test files, so
      # 2 shards put 157 files (4178 tests) in each — and Vitest's shard
      # split sorts spec paths by SHA-1 hash and slices by index
      # (`shard()` in node_modules/vitest/dist/chunks/index.B8VfM7Mf.js),
      # so the split is balanced by FILE COUNT but blind to DURATION.
      # Measured across five CI runs the slowest shard ran 157s-203s while
      # the fastest ran 126s-186s — a 1.52x spread (196s vs 129s in one
      # run) — and the SLOWEST shard, not the average, is what sets the
      # critical path. 4 shards cuts the longest shard to roughly a quarter
      # of the work, while each shard's fixed prep (checkout + npm ci +
      # build) stays parallel. The split is deterministic (path hash), so it
      # is stable from run to run.
      test-shards: "4"
      # The shard matrix is passed explicitly, which SKIPS the shared
      # workflow's `shard-plan` job — a whole runner spent running `jq` to
      # emit `[1..N]` on every CI run (s3ntin3l8/.github#118). `test-shards`
      # is still set: it is what gates the sharded path on.
      test-shard-matrix: "[1,2,3,4]"
      # The shard jobs run the suite against the SOURCE tree (Vitest
      # transforms `src/` on the fly), so they do not need `npm run build` —
      # which was a full `tsc` + copy + smoke-test in every shard.
      # `lint-and-test` still builds once, so a broken build is still caught.
      shard-build-script: "none"
      # Namespace this caller's shard artifacts. Artifact names are scoped to
      # the WORKFLOW RUN, not to the caller — and this workflow calls the
      # shared ci-node.yml twice, both of them sharded. Without a distinct
      # prefix per caller, the backend's `coverage-shard-1` and the
      # frontend's `coverage-shard-1` are the SAME artifact name, and
      # `test-merge` downloads whichever one it finds: the backend's merge
      # then folds the frontend's coverage maps into the backend's report
      # and enforces the threshold against a number describing neither
      # workspace. Measured: merged backend coverage fell from 93.92% to
      # 74.9% and the coverage gate fired on a bogus figure. The fix lives
      # in the shared workflow's `artifact-prefix` input
      # (s3ntin3l8/.github#118) — see docs/ci-cd.md.
      artifact-prefix: "-backend"
      strict-checks: true
      # Only the files this push touched can have introduced a secret.
      # detect-secrets matches a known secret by filename, hash and type -- not
      # by line number -- so a secret that shifts lines is still recognised,
      # and the hook rewrites the baseline's line number and fails the build
      # until the baseline is refreshed. That is why a change that moves, adds
      # or removes a baselined secret needs the baseline refreshed in the same
      # change; a change that leaves every baselined secret where it was does
      # not.
      detect-secrets-scope: "changed"
    secrets: inherit # pragma: allowlist secret

  test-frontend:
    permissions:
      contents: read
    uses: s3ntin3l8/.github/.github/workflows/ci-node.yml@main
    with:
      node-version: "26"
      working-directory: "frontend"
      cache-dependency-path: "frontend/package-lock.json"
      typecheck-script: "typecheck"
      test-script: "test:coverage"
      # Measured at 80.21% line coverage as of this PR (frontend/vitest.config.ts's
      # new coverage block) — 70 leaves ~10 points of headroom to add
      # uncovered code without CI going red on routine changes, same
      # philosophy as test-node's own 80-against-~92% floor above (a real
      # floor with room to breathe, not a cosmetic bump off 0).
      coverage-fail-under: "70"
      # Sharded as of 2026-10-22 (CI audit). The frontend suite is 228 test
      # files and took 158.90s in a single job, of which 31% (~49s) was
      # jsdom environment setup — with the backend resharded to 4, the
      # frontend would otherwise become the critical path.
      #
      # IMPORTANT, same reason as test-node's note above: sharding moves the
      # frontend's test run AND its coverage-fail-under gate out of
      # `test-frontend / lint-and-test` into a NEW job,
      # `test-frontend / test-merge`. Branch protection on main must
      # include `test-frontend / test-merge`, or a broken frontend suite
      # would merge silently — `test-frontend / lint-and-test` would still
      # report green while running no tests at all.
      test-shards: "2"
      # Same two inputs as the backend caller: no `shard-plan` runner, and
      # no per-shard `vite build` (the shard jobs run against `frontend/src`
      # directly).
      test-shard-matrix: "[1,2]"
      shard-build-script: "none"
      # Distinct from the backend's prefix — see the note on the test-node
      # caller above. Both callers shard, so both need their own namespace.
      artifact-prefix: "-frontend"
      # `test-pool` is deliberately NOT set. `vmThreads` would cut this
      # suite's jsdom environment setup (31% of its 158.90s runtime) to
      # ~3%, but it runs each worker in a `vm` context where
      # `globalThis.location` is non-configurable — and five test files
      # stub it (`src/api/client.test.ts`, `src/hooks/useSdkLicenses.test.tsx`,
      # `src/hooks/useSystemImageInstall.test.tsx`,
      # `src/settings/sections/AccountSection.test.tsx`,
      # `src/voice/support.test.ts`), so 24 tests fail with "Cannot redefine
      # property: location". Measured locally with
      # `npx vitest run --pool=vmThreads` before enabling it. Leave this
      # unset until those files stop stubbing `location`/`window`.
      #
      # NEVER set `test-pool` on the test-node caller either: `vmThreads`
      # does not load native addons, and the backend needs the
      # better-sqlite3 and node-pty native bindings over a real temp
      # SQLite DB.
      strict-checks: true
      # The tree was already scanned by the test-node job above.
      detect-secrets: false
    secrets: inherit # pragma: allowlist secret

  # Advisory, NOT a required check (#1920). Runs our own
  # scripts/check-patch-coverage.mjs -- the same check the pre-push hook runs --
  # over the union of the shard coverage reports the two jobs above upload, so
  # it can be compared with Codecov's `codecov/patch` (which counts lines
  # differently). Once the two agree, Codecov can be opted out of; see
  # docs/ci-cd.md. `continue-on-error` keeps a red result from failing the run.
  patch-coverage:
    if: github.event_name == 'pull_request'
    needs: [test-node, test-frontend]
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: "npm"
      # The script parses sources with the TypeScript compiler.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      # Names come from the `artifact-prefix` inputs above; the shared
      # ci-node.yml uploads `coverage-shard<prefix>-<n>`.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-shard-*
          path: .shard-artifacts
      - name: Patch coverage (own check)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -o pipefail
          args=()
          while IFS= read -r f; do args+=(--coverage "$f"); done \
            < <(find .shard-artifacts -name coverage-final.json | sort)
          if [ "${#args[@]}" -eq 0 ]; then
            echo "::warning::no shard coverage reports were downloaded"
            exit 0
          fi
          status=0
          node scripts/check-patch-coverage.mjs --no-run --annotations \
            --base "origin/${BASE_REF}" "${args[@]}" | tee patch-coverage.txt || status=$?
          {
            echo '### Patch coverage (own check, advisory; threshold 75%)'
            echo '```'
            grep -v '^::warning' patch-coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # Issue #407 (B3 of the audit remediation plan) — runs the opt-in e2e
  # suite (vitest.e2e.config.ts / `make test-e2e`, see test/e2e/README.md)
  # in CI. A real, multi-step job rather than a `with:` tweak to test-node
  # above — same "no upstream reusable workflow for this" exception class
  # as release-please.yml's build-tarball job (see that job's own comment):
  # ci-node.yml's reusable `lint-and-test` job has no hook to run an
  # arbitrary setup command (e.g. `playwright install`) before its Test
  # step, and this repo can't add one without editing s3ntin3l8/.github,
  # which is out of this PR's reach. The e2e suite itself needs nothing
  # else CI-unfriendly — test/e2e/multi-host.e2e.test.ts's own comment
  # documents that dtach/systemd-run are mocked throughout (real process
  # lifecycle is deliberately out of this suite's scope, see
  # test/e2e/README.md's "What stays manual" section), so a stock
  # ubuntu-latest runner with a real Chromium is sufficient.
  #
  # Deliberately NOT added to docs/ci-cd.md's required-status-checks list yet:
  # this is the suite's first run anywhere outside a developer's own
  # machine, so it needs a stretch of real, unattended CI runs (network
  # variance on the Chromium download, shared-runner resource limits under
  # vitest.e2e.config.ts's `fileParallelism: false` real-browser tests) to
  # prove it isn't flaky before every future merge is gated on it.
  test-e2e:
    runs-on: ubuntu-latest
    # 25, not 15 (2026-10-22 CI audit). The `Install Playwright Chromium`
    # step measured 11-32s in 8 of 10 runs but 632s and 509s in the other
    # two — and the slow runs are apt, not Playwright: the Chromium cache
    # hit normally, but `playwright install --with-deps` also runs apt,
    # and one run fetched 25.9 MB at 43.1 kB/s ("Fetched 25.9 MB in 10min
    # 2s"). At 15 minutes the 632s case left only ~3.5m of headroom for a
    # 2-minute e2e suite, so a slightly slower mirror timed the job out —
    # a red e2e that is easy to miss, since this job is not a required
    # status check.
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      # Caches the downloaded Chromium binary (not the OS-level deps
      # `--with-deps` also installs below, which don't persist across the
      # runner's ephemeral filesystem anyway) — keyed off a hash of the
      # whole root package-lock.json (the pinned `playwright` version lives
      # in there, so a version bump invalidates the cache automatically),
      # not restricted to just the playwright entry: hashFiles() can't hash
      # a sub-field, only whole files. No restore-keys fallback, so an
      # unrelated dependency bump costs a full re-download rather than
      # silently reusing a stale browser build under a partial-match key.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: |
          # `playwright install --with-deps` also runs apt, and apt is the
          # step that actually varies: one measured run fetched 25.9 MB at
          # 43.1 kB/s and took 10m02s on its own. That transfer SUCCEEDED,
          # just slowly — so `Acquire::Retries` (which only re-attempts a
          # fetch that FAILED) does not address it; the timeout bump on this
          # job is the real fix. The retry below is still worth setting:
          # a mirror that fails outright is then retried instead of
          # failing the job.
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/99-retries
          npx playwright install --with-deps chromium
      # Install the pinned opencode (v2) the
      # `test/e2e/opencode-v2-contract.e2e.test.ts` contract test asserts
      # against: `--standalone`, `OPENCODE_CONFIG_CONTENT` layering
      # alongside the user's own config, directory-plugin loading, and the
      # `session export/import` subcommands (all verified empirically
      # against 2.0.29). A future opencode release that changes any of them
      # fails the test and forces a re-verification before the pin is
      # bumped. Same posture as the Playwright install above: a real binary
      # the test invokes, not a mock. The test sandboxes itself (XDG dirs +
      # a private service port) and stops the background service it spawns.
      #
      # Hermes review, PR #966 — uses a dedicated workspace
      # (test/e2e/opencode/) with its own package-lock.json rather than
      # `npm install -g @opencode/cli@2.0.29` so the integrity hash is locked
      # in `package-lock.json` and enforced by `npm ci` (a registry
      # republish of the 2.0.29 tag with different content would fail
      # EINTEGRITY here, not silently install a tampered binary). When
      # bumping the version, regenerate the lockfile with
      # `cd test/e2e/opencode && rm -rf node_modules package-lock.json &&
      # npm install --package-lock-only` against the new version and commit.
      - name: Install opencode (pinned, integrity-checked)
        working-directory: test/e2e/opencode
        run: npm ci
      # Make the locally-installed `opencode` binary the one PATH
      # resolves, so the test/e2e test's bare `execFileSync("opencode")`
      # call hits the integrity-checked binary rather than whatever
      # happens to be on the runner's PATH already.
      - name: Prepend local opencode to PATH
        working-directory: test/e2e/opencode
        run: echo "$(pwd)/node_modules/.bin:$PATH" >> "$GITHUB_PATH"
      - name: Run e2e suite
        run: npm run test:e2e
